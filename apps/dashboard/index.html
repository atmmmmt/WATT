<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <title>VAYRO — منصة واتساب للأعمال</title>
    <meta name="description" content="VAYRO — منصة واتساب المتكاملة للأعمال. OTP، دعم العملاء، التحليلات." />

    <!-- PWA: installable on Windows & mobile -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F2E27" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VAYRO" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      #vayro-boot-splash { display: none; }
      @media (max-width: 768px) {
        #vayro-boot-splash {
          position: fixed;
          inset: 0;
          z-index: 99999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 16px;
          padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
          background: #f7faf9;
          color: #064e3b;
          font-family: 'Tajawal', system-ui, sans-serif;
          transition: opacity .18s ease, visibility .18s ease;
        }
        #vayro-boot-splash.is-ready { opacity: 0; visibility: hidden; pointer-events: none; }
        #vayro-boot-splash img { width: 88px; height: 88px; object-fit: contain; border-radius: 24px; }
        #vayro-boot-splash strong { font-family: Inter, system-ui, sans-serif; font-size: 25px; letter-spacing: .08em; }
        #vayro-boot-splash span { font-size: 12px; color: #6b7f78; }
        #vayro-boot-splash i {
          display: block;
          width: 28px;
          height: 3px;
          border-radius: 99px;
          background: #d9e7e2;
          overflow: hidden;
          position: relative;
          margin-top: 4px;
        }
        #vayro-boot-splash i::after {
          content: '';
          position: absolute;
          inset: 0;
          width: 45%;
          border-radius: inherit;
          background: #10b981;
          animation: vayroBoot 1s ease-in-out infinite alternate;
        }
        @keyframes vayroBoot { from { transform: translateX(-10px); } to { transform: translateX(26px); } }
      }
    </style>
  </head>
  <body>
    <div id="vayro-boot-splash" aria-hidden="true">
      <img src="/icons/icon-192.png" alt="" />
      <strong>VAYRO</strong>
      <span>تواصل أذكى لأعمال أكبر</span>
      <i></i>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
